<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151515" media="(prefers-color-scheme: dark)">
  <title>去AI味</title>
  <meta name="description" content="把文字里的模型腔调改掉，数字和事实一个不丢。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23141414'/%3E%3Ctext x='16' y='22' font-size='14' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='%23fff'%3EAI%3C/text%3E%3Cpath d='M5 20 L27 12' stroke='%23cf2e1d' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css?v=5">
  <script>try { const t = localStorage.getItem('noai.theme'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body data-view="src">
  <div class="shell">
    <header class="bar">
      <a class="logo" href="/">去<s>AI</s>味</a>

      <div class="opts" id="controls" aria-label="改写设置">
        <div class="sheet-head-m"><span>设置</span><button class="textbtn" id="sheetClose">关闭</button></div>
        <div class="opt"><label for="mode">场景</label><select id="mode"></select></div>
        <div class="opt"><span class="lbl">改动</span><span class="seg" id="strength" role="radiogroup"></span><span class="seg-desc" id="strengthDesc"></span></div>
        <div class="opt opt-lang"><label for="lang">语言</label>
          <select id="lang"><option value="auto">自动</option><option value="zh">中文</option><option value="en">English</option></select>
        </div>
        <button id="toggleAdv" class="textbtn" aria-expanded="false">更多选项</button>
        <div class="advanced hidden" id="adv">
          <label class="f">必须原样保留的词，每行一个
            <textarea id="protect" class="plain"></textarea>
          </label>
          <label class="f">额外要求
            <textarea id="instructions" class="plain" placeholder="如：保持第一人称"></textarea>
          </label>
          <label class="f full">参考文风（贴几段你自己写的东西，空行分隔。只学节奏，不抄句子）
            <textarea id="samples" class="plain" style="min-height:90px"></textarea>
          </label>
          <div class="full checks">
            <label class="check"><input type="checkbox" id="keepStructure">段落不动</label>
            <label class="check"><input type="checkbox" id="semantic">再让另一个模型核对事实</label>
            <label class="check"><input type="checkbox" id="force">原文不像 AI 也照改</label>
          </div>
          <div class="full" id="modelPick"></div>
        </div>
        <button class="btn primary sheet-done" id="sheetDone">好了</button>
      </div>

      <div class="bar-right">
        <div id="keyBox" class="keybox hidden">
          <input id="accessKey" type="password" placeholder="访问密钥" autocomplete="off">
          <button id="saveKey" class="btn small">保存</button>
        </div>
        <button id="keyToggle" class="textbtn hidden">密钥</button>
        <button id="theme" class="textbtn" title="切换深浅色">深色</button>
        <a class="textbtn" href="/admin">后台</a>
        <button id="run" class="btn primary run-desk">去 AI 味 <kbd>Ctrl ↵</kbd></button>
      </div>
    </header>

    <nav class="mtabs" id="mtabs" aria-label="视图">
      <button data-view="src" class="on">原文</button>
      <button data-view="out">结果<i class="dot hidden" id="outDot"></i></button>
      <button data-view="log">过程</button>
    </nav>

    <main class="desk">
      <section class="pane pane-src" id="srcPane" aria-label="原文">
        <div class="pane-head">
          <h2>原文</h2>
          <div class="tabs" id="inTabs"><button data-v="edit" class="on">编辑</button><button data-v="marks">看问题</button></div>
          <span class="grow"></span>
          <span class="meta" id="inCount">0 字</span>
          <span class="score">AI 味 <b id="scoreIn">–</b></span>
          <button id="sample" class="textbtn">示例</button>
        </div>
        <div class="pane-body">
          <textarea id="input" class="text" spellcheck="false" placeholder="粘贴要改的文字"></textarea>
          <div id="marks" class="marks hidden"></div>
        </div>
      </section>

      <section class="pane pane-out" aria-label="结果">
        <div class="pane-head">
          <h2>结果</h2>
          <div class="tabs" id="outTabs"><button data-v="out" class="on">改后</button><button data-v="diff">改了哪</button><button data-v="info">检查</button></div>
          <span class="grow"></span>
          <span class="meta" id="outMeta"></span>
          <span class="score">AI 味 <b id="scoreOut">–</b></span>
          <button id="copy" class="btn small" disabled>复制</button>
        </div>
        <div class="pane-body">
          <div id="output" class="output-view empty">还没有结果。</div>
          <div id="diff" class="output-view hidden"></div>
          <div id="info" class="details hidden"></div>
        </div>
      </section>
    </main>

    <section class="console idle" id="logPanel" aria-label="处理过程">
      <div class="console-head"><h2>过程</h2><span id="elapsed" class="mono"></span><span class="grow"></span><button id="fold" class="textbtn">收起</button></div>
      <ol class="timeline" id="timeline"><li class="muted"><span class="t"></span><span class="ic"></span><span>还没开始。</span></li></ol>
    </section>
  </div>

  <div class="actionbar" id="actionbar">
    <button id="openSheet" class="btn">设置</button>
    <span class="score">AI 味 <b id="miniIn">–</b> → <b id="miniOut">–</b></span>
    <button id="runMobile" class="btn primary">去 AI 味</button>
  </div>
  <div class="scrim" id="scrim"></div>
  <div class="popover hidden" id="pop" role="tooltip"></div>
  <script src="/app.js?v=5" type="module"></script>
</body>
</html>
